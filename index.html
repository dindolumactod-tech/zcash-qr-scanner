  *{box-sizing:border-box}
  body{

    background:#f0fdf4;
    color:#14532d;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:18px;
  }
  .app{
    width:100%;
    max-width:520px;
    background:#fff;
    border-radius:18px;
    padding:20px;

    width:100%;
    min-height:280px;
    overflow:hidden;
    border-radius:14px;
  }
  .status{
    margin:14px 0;
    padding:12px;
    border-radius:10px;
    background:#ecfdf5;
    color:#166534;
    font-weight:600;
  }
  .status.error{background:#fef2f2;color:#b91c1c}
  button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#15803d;
    color:#fff;
    font-weight:700;
    font-size:16px;
  }
  button:disabled{opacity:.55}
  .small{font-size:12px;color:#6b7280;margin-top:12px}

  <p>Scan a Z-CASH wallet QR code</p>

  <div id="status" class="status">Preparing camera…</div>
  <button id="closeButton" type="button" onclick="closeScanner()">RETURN TO Z-CASH</button>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const returnUrl = params.get("return") || "";
  const statusEl = document.getElementById("status");
  let scanner = null;
  let handled = false;

  function setStatus(text, error){
    statusEl.textContent = text;
    statusEl.className = "status" + (error ? " error" : "");
  }

  function goBack(extra){
    if (!returnUrl) {
      setStatus("Scanner opened without a Z-CASH return address.", true);
      return;
    }
    try {
      const target = new URL(returnUrl);
      Object.keys(extra || {}).forEach(function(k){
        target.searchParams.set(k, extra[k]);
      });
      location.href = target.toString();
    } catch(e) {
      setStatus("The Z-CASH return address is invalid.", true);
    }
  }

  window.closeScanner = function(){
    goBack({scanCancelled:"1"});
  };

  function handleScan(decodedText){
    if (handled) return;
    const raw = String(decodedText || "").trim();
    if (!raw) return;

    let walletID = "";
    try {
      const u = new URL(raw);
      walletID = u.searchParams.get("pay") || "";
    } catch(e) {}

    // Also accept a plain WalletID QR if one is used later.
    if (!walletID && /^WLT-[A-Za-z0-9_-]+$/i.test(raw)) {
      walletID = raw;
    }

    if (!walletID) {
      setStatus("This is not a valid Z-CASH payment QR code.", true);
      return;
    }

    handled = true;
    setStatus("QR detected. Returning to Z-CASH…", false);

    if (scanner) {
      scanner.stop().catch(function(){});
    }

    goBack({pay: walletID});
  }

  async function start(){
    if (typeof Html5Qrcode === "undefined") {
      setStatus("QR scanner library could not be loaded.", true);
      return;
    }

    if (!window.isSecureContext) {
      setStatus("Camera requires a secure HTTPS page. Please open the GitHub Pages scanner directly in Chrome/Safari.", true);
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("This browser does not provide camera access. Please open the scanner in Chrome or Safari.", true);
      return;
    }

    try {
      // Request camera permission explicitly first. This makes mobile
      // permission handling much more reliable than relying on a later
      // library call alone.
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
      stream.getTracks().forEach(function(track){ track.stop(); });

      const cameras = await Html5Qrcode.getCameras();
      if (!cameras || !cameras.length) {
        setStatus("No camera was found on this device. Check the phone camera and browser permissions.", true);
        return;
      }

      // Prefer the rear/environment camera on phones.
      let cameraId = cameras[0].id;
      const rear = cameras.find(function(c){
        return /back|rear|environment|facing/i.test(c.label || "");
      });
      if (rear) cameraId = rear.id;

      scanner = new Html5Qrcode("reader");

      await scanner.start(
        cameraId,
        { fps:10, qrbox:{width:250,height:250} },
        handleScan,
        function(){ /* normal scan misses are ignored */ }
      );

      setStatus("Camera ready. Point the camera at a Z-CASH QR code.", false);

    } catch(err) {
      console.error("Z-CASH camera error:", err);

      let message = "Camera could not start.";
      if (err && err.name === "NotAllowedError") {
        message = "Camera permission was denied. Allow Camera for this GitHub Pages site, then reload the scanner.";
      } else if (err && err.name === "NotFoundError") {
        message = "No camera was found on this device.";
      } else if (err && err.name === "NotReadableError") {
        message = "The camera is already being used by another app or browser tab. Close it and try again.";
      } else if (err && err.name === "SecurityError") {
        message = "The browser blocked camera access for security reasons. Open this scanner directly in HTTPS Chrome/Safari.";
      }

      setStatus(message, true);
    }
  }

  start();
})();
</script>
