<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Z-CASH QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f5f7f5;color:#15301f}
  .wrap{max-width:520px;margin:0 auto;padding:18px}
  .card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.10)}
  h1{margin:0 0 6px;text-align:center;color:#15803d;font-size:26px}
  p{margin:6px 0 14px;text-align:center}
  #reader{width:100%;min-height:280px}
  .status{margin-top:12px;padding:10px;border-radius:10px;background:#edf7ef;text-align:center}
  .status.error{background:#fdecec;color:#9b1c1c}
  button{width:100%;border:0;border-radius:11px;padding:12px;margin-top:10px;font-weight:700;font-size:15px;cursor:pointer}
  #start{background:#15803d;color:#fff}
  #close{background:#e5e7eb;color:#1f2937}
  .small{text-align:center;font-size:12px;color:#667085;margin-top:10px}
  select{width:100%;padding:11px;border-radius:10px;border:1px solid #cbd5e1;margin-top:8px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>Z-CASH QR SCANNER</h1>
  <p>Scan the recipient's Z-CASH QR code.</p>
  <div id="reader"></div>
  <div id="status" class="status">Tap START REAR CAMERA. Allow camera permission when asked.</div>
  <select id="cameraSelect" style="display:none"></select>
  <button id="start">START REAR CAMERA</button>
  <button id="close">CLOSE SCANNER</button>
  <div class="small">The scanner returns the recipient Wallet ID to Z-CASH automatically.</div>
</div></div>
<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const returnUrl=qs.get('return')||'';
  const statusEl=document.getElementById('status');
  const startBtn=document.getElementById('start');
  const closeBtn=document.getElementById('close');
  const select=document.getElementById('cameraSelect');
  let scanner=null, running=false, handled=false;

  function status(t,error){statusEl.textContent=t;statusEl.className='status'+(error?' error':'');}
  function targetUrl(extra){
    if(!returnUrl) return '';
    try{const u=new URL(returnUrl);Object.keys(extra||{}).forEach(k=>u.searchParams.set(k,extra[k]));return u.toString();}
    catch(e){return '';}
  }
  function returnToZcash(extra){
    const target=targetUrl(extra);
    if(!target){status('Z-CASH return address is missing or invalid.',true);return;}
    try{
      if(window.opener && !window.opener.closed){
        window.opener.location.href=target;
        setTimeout(function(){try{window.close();}catch(e){}},250);
        status('Recipient captured. Returning to Z-CASH…');
        return;
      }
    }catch(e){}
    location.href=target;
  }
  async function stop(){
    if(scanner && running){try{await scanner.stop();}catch(e){} try{scanner.clear();}catch(e){}}
    scanner=null;running=false;
  }
  async function startWithConfig(cfg,label){
    await stop();
    scanner=new Html5Qrcode('reader');
    try{
      await scanner.start(cfg,{fps:5,qrbox:{width:250,height:250}},onScan,function(){});
      running=true;status(label||'Rear camera ready. Point at the Z-CASH QR code.');
      startBtn.disabled=true;
      return true;
    }catch(e){
      running=false;scanner=null;return false;
    }
  }
  async function startScanner(){
    if(running||handled)return;
    if(typeof Html5Qrcode==='undefined'){status('QR scanner library could not be loaded.',true);return;}
    startBtn.disabled=true;status('Starting rear camera…');
    // First try the browser's exact rear/environment camera constraint.
    if(await startWithConfig({facingMode:{exact:'environment'}},'Rear camera ready. Point at the Z-CASH QR code.'))return;

    // If exact environment selection is unsupported, enumerate cameras after
    // permission and choose the one whose label most strongly suggests rear.
    try{
      const cameras=await Html5Qrcode.getCameras();
      if(!cameras||!cameras.length)throw new Error('No camera found.');
      select.innerHTML='';
      let preferred=cameras.find(c=>/back|rear|environment|world/i.test(c.label||''))||cameras[cameras.length-1];
      cameras.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.label||'Camera';if(c.id===preferred.id)o.selected=true;select.appendChild(o);});
      select.style.display=cameras.length>1?'block':'none';
      if(await startWithConfig({deviceId:{exact:preferred.id}},'Rear camera ready. Point at the Z-CASH QR code.'))return;
    }catch(e){}
    startBtn.disabled=false;status('Unable to start the rear camera. Allow camera permission and try again.',true);
  }
  async function onScan(decodedText){
    if(handled)return;
    const raw=String(decodedText||'').trim(); if(!raw)return;
    let wallet='';
    try{const u=new URL(raw);wallet=u.searchParams.get('pay')||'';}catch(e){}
    if(!wallet && /^WAL-[A-Za-z0-9_-]+$/i.test(raw))wallet=raw;
    if(!wallet){status('This is not a valid Z-CASH payment QR code.',true);return;}
    handled=true;await stop();status('QR captured. Returning to Z-CASH…');returnToZcash({pay:wallet});
  }
  select.addEventListener('change',async function(){if(!this.value||handled)return;const ok=await startWithConfig({deviceId:{exact:this.value}},'Selected camera ready. Point at the Z-CASH QR code.');if(!ok){status('Selected camera could not be started.',true);startBtn.disabled=false;}});
  startBtn.addEventListener('click',startScanner);
  closeBtn.addEventListener('click',async function(){await stop();returnToZcash({scanCancelled:'1'});});
})();
</script>
</body></html>
